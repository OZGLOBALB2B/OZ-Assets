<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נכסי מותג · OZ Global B2B</title>
<meta name="description" content="הלוגו, הצבעים, הפונטים והחומרים של OZ Global B2B — לשימוש עובדי החברה.">
<meta property="og:title" content="נכסי מותג · OZ Global B2B">
<meta property="og:description" content="הלוגו, הצבעים, הפונטים והחומרים של OZ Global B2B.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
/* ---------- Ploni (self-hosted) ---------- */
@font-face{font-family:"Ploni";src:url("assets/fonts/ploni-300.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"Ploni";src:url("assets/fonts/ploni-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Ploni";src:url("assets/fonts/ploni-500.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Ploni";src:url("assets/fonts/ploni-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Ploni";src:url("assets/fonts/ploni-700.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Ploni";src:url("assets/fonts/ploni-900.woff2") format("woff2");font-weight:900;font-style:normal;font-display:swap}

:root{
  --accent:#83D429;--accent-ink:#0F0156;
  --ink:#0F0156;--ink-2:#3a3560;--ink-3:#8a86a6;
  --surface:#F5F5F2;--card:#FFFFFF;--line:#E4E3EC;--dark:#0F0156;
  --body:"Ploni","Segoe UI",sans-serif;--mono:"Ploni",ui-monospace,Menlo,monospace;
  --r:14px;--pad:clamp(20px,4vw,56px);--track:-.02em;--border:1px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad)}
[hidden]{display:none!important}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);direction:ltr;display:inline-block;text-transform:uppercase;font-weight:600}
.he-label{font-size:12px;letter-spacing:.05em;color:var(--ink-3);font-weight:500}

.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);border-bottom:var(--border) solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:64px}
.topbar .mini{display:block;height:32px;width:auto;flex:none}
.topbar .mini svg{height:100%;width:auto;display:block}
.topbar nav{margin-inline-start:auto;display:flex;gap:20px;font-size:14.5px;color:var(--ink-2)}
.topbar nav a{text-decoration:none}
.topbar nav a:hover{color:var(--accent)}
.langswitch{display:flex;border:var(--border) solid var(--line);border-radius:100px;overflow:hidden;margin-inline-start:16px;flex:none}
.langswitch button{border:0;background:none;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink-3);font-family:var(--mono)}
.langswitch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media(max-width:900px){.topbar nav{display:none}.langswitch{margin-inline-start:auto}}

.hero{padding:clamp(46px,8vw,100px) 0 clamp(30px,5vw,54px)}
.hero h1{font-weight:900;font-size:clamp(38px,7.5vw,76px);line-height:1.03;letter-spacing:var(--track);margin:14px 0 0;max-width:16ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:56ch;color:var(--ink-2);font-size:clamp(16px,1.6vw,18.5px);margin:20px 0 0}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:9px;border:var(--border) solid var(--ink);background:var(--ink);color:var(--surface);padding:12px 22px;border-radius:100px;font-size:15px;font-weight:600;text-decoration:none;transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn svg{width:16px;height:16px}
.specstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--border);background:var(--line);border-block:var(--border) solid var(--line);margin-top:clamp(36px,6vw,68px)}
.specstrip div{background:var(--surface);padding:18px 20px}
.specstrip b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;direction:ltr}
@media(max-width:640px){.specstrip{grid-template-columns:repeat(2,1fr)}}

section{padding:clamp(50px,7.5vw,92px) 0}
.sechead{display:flex;align-items:baseline;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sechead h2{font-weight:900;letter-spacing:var(--track);font-size:clamp(24px,3.6vw,36px);margin:0}
.sechead p{margin:0;color:var(--ink-2);font-size:15.5px;max-width:54ch}

.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--border);background:var(--line);border:var(--border) solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:26px}
.picker div{background:var(--card);padding:16px 18px}
.picker b{display:block;font-size:14.5px;font-weight:700;margin-bottom:4px}
.picker span{font-size:13px;color:var(--ink-2)}
.picker i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--accent);display:block;margin-top:8px;direction:ltr;font-weight:600}
@media(max-width:820px){.picker{grid-template-columns:repeat(2,1fr)}}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:var(--border) solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:var(--border) solid var(--line)}
.card-head h3{margin:0;font-size:15.5px;font-weight:700}
.card-head .he-label{margin-inline-start:auto}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;border:var(--border) solid var(--line);border-radius:5px;padding:2px 7px;color:var(--ink-3);direction:ltr}
.tag.src{color:var(--accent);border-color:var(--accent)}

.stage{position:relative;min-height:210px;display:grid;place-items:center;padding:34px;--sq:12px;
  background-color:#fff;
  background-image:linear-gradient(45deg,#EDEEF2 25%,transparent 25%,transparent 75%,#EDEEF2 75%),linear-gradient(45deg,#EDEEF2 25%,transparent 25%,transparent 75%,#EDEEF2 75%);
  background-size:calc(var(--sq)*2) calc(var(--sq)*2);background-position:0 0,var(--sq) var(--sq);transition:background-color .2s ease}
.stage[data-bg="light"]{background-image:none;background-color:#fff}
.stage[data-bg="dark"]{background-image:none;background-color:var(--dark)}
.stage[data-bg="brand"]{background-image:none;background-color:var(--accent)}
.stage .logo{position:relative;max-width:min(320px,84%)}
.stage .logo svg{width:100%;height:auto;display:block}
.stage .logo::after{content:"";position:absolute;inset:-22%;border:1px dashed var(--accent);border-radius:3px;opacity:0;transition:opacity .18s ease;pointer-events:none}
.stage.guides .logo::after{opacity:.95}
.stage.guides[data-bg="dark"] .logo::after,.stage.guides[data-bg="brand"] .logo::after{border-color:#fff}
.guide-note{position:absolute;inset-inline-start:12px;bottom:10px;font-size:11px;font-weight:500;color:var(--accent);opacity:0;transition:opacity .18s ease}
.stage.guides .guide-note{opacity:1}
.stage[data-bg="dark"].guides .guide-note,.stage[data-bg="brand"].guides .guide-note{color:#fff}
.warn{position:absolute;inset-inline-end:12px;top:12px;background:#E02040;color:#fff;font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:6px;display:none}
.stage.bad .warn{display:block}

.controls{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:var(--border) solid var(--line);flex-wrap:wrap}
.swatches{display:flex;gap:6px}
.sw{width:23px;height:23px;border-radius:calc(var(--r)/2);border:var(--border) solid var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent);border-color:transparent}
.sw.trans{background:linear-gradient(45deg,#E7E9EE 25%,#fff 25%,#fff 75%,#E7E9EE 75%),linear-gradient(45deg,#E7E9EE 25%,#fff 25%,#fff 75%,#E7E9EE 75%);background-size:10px 10px;background-position:0 0,5px 5px}
.sw.light{background:#fff}
.sw.dark{background:var(--dark)}
.sw.brand{background:var(--accent)}
.toggle{display:inline-flex;align-items:center;gap:7px;background:none;border:0;font-size:12.5px;font-weight:500;color:var(--ink-3);padding:4px 2px;margin-inline-start:auto}
.toggle[aria-pressed="true"]{color:var(--accent)}
.toggle .dot{width:9px;height:9px;border-radius:50%;border:1px solid currentColor}
.toggle[aria-pressed="true"] .dot{background:currentColor}

.formats{display:flex;gap:8px;padding:0 18px 18px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:var(--border) solid var(--line);background:var(--surface);border-radius:calc(var(--r)*.65);padding:8px 13px;font-family:var(--mono);font-size:11.5px;direction:ltr;transition:border-color .15s ease,color .15s ease,background .15s ease}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--card)}
.chip small{color:var(--ink-3);font-size:10px}
.chip:hover small{color:inherit;opacity:.75}

.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:860px){.colors{grid-template-columns:repeat(2,1fr)}}
.color{border:var(--border) solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);text-align:start;padding:0;display:block;width:100%}
.color .chipcolor{height:104px;position:relative;border-bottom:var(--border) solid var(--line)}
.color .meta{padding:14px 16px}
.color .meta b{display:block;font-size:14.5px;font-weight:700}
.color .meta span{display:block;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-top:5px;direction:ltr;text-align:start}
.color .role{font-family:var(--body)!important;font-size:12.5px!important;color:var(--ink-3)!important;direction:inherit!important}
.color .copy{position:absolute;inset:auto 10px 10px auto;background:rgba(255,255,255,.92);color:#000;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:500;opacity:0;transition:opacity .15s ease}
.color:hover .copy,.color:focus-visible .copy{opacity:1}

.typeblock{background:var(--card);border:var(--border) solid var(--line);border-radius:var(--r);padding:clamp(22px,3.5vw,40px)}
.typerow{display:grid;grid-template-columns:210px 1fr;gap:26px;padding:24px 0;border-top:var(--border) solid var(--line)}
.typerow:first-child{border-top:0;padding-top:0}
.typerow:last-child{padding-bottom:0}
@media(max-width:760px){.typerow{grid-template-columns:1fr;gap:10px}}
.typerow .info b{display:block;font-size:15px}
.typerow .info span{font-size:12.5px;color:var(--ink-3);display:block;margin-top:5px;direction:ltr;text-align:start}
.sample{line-height:1.2}

/* resources */
.reslist{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:860px){.reslist{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.reslist{grid-template-columns:1fr}}
.res{display:flex;flex-direction:column;background:var(--card);border:var(--border) solid var(--line);border-radius:var(--r);overflow:hidden}
.res-top{padding:18px 18px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.res .cat{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;direction:ltr}
.res b{font-size:15.5px;font-weight:700}
.res p{margin:0;font-size:13.5px;color:var(--ink-2)}
.res-dl{display:flex;align-items:center;gap:9px;padding:13px 18px;border-top:var(--border) solid var(--line);background:var(--surface);text-decoration:none;font-weight:600;font-size:14px;transition:background .15s ease,color .15s ease}
.res-dl:hover{background:var(--accent);color:var(--accent-ink)}
.res-dl .ext{font-family:var(--mono);font-size:11px;border:var(--border) solid var(--line);border-radius:5px;padding:2px 7px;direction:ltr}
.res-dl:hover .ext{border-color:currentColor}
.res-dl .sz{margin-inline-start:auto;font-size:11.5px;color:var(--ink-3);direction:ltr}
.res-dl:hover .sz{color:inherit}
.res-dl svg{width:15px;height:15px;flex:none}
.res.empty{align-items:center;justify-content:center;text-align:center;padding:26px;color:var(--ink-3);font-size:13.5px;border-style:dashed}

/* voice */
.voice{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
@media(max-width:820px){.voice{grid-template-columns:1fr}}
.trait{background:var(--card);border:var(--border) solid var(--line);border-radius:var(--r);padding:20px}
.trait b{display:block;font-size:16px;font-weight:700;margin-bottom:6px}
.trait p{margin:0;color:var(--ink-2);font-size:14px}
.saypairs{border:var(--border) solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.pair{display:grid;grid-template-columns:1fr 1fr;border-top:var(--border) solid var(--line)}
.pair:first-child{border-top:0}
.pair div{padding:16px 18px;font-size:14.5px}
.pair .say{border-inline-end:var(--border) solid var(--line)}
.pair .lbl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;margin-bottom:6px;direction:ltr;text-transform:uppercase}
.pair .say .lbl{color:var(--accent)}
.pair .dont .lbl{color:#E02040}
.pair .dont{color:var(--ink-3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,#E02040 45%,transparent)}
@media(max-width:640px){.pair{grid-template-columns:1fr}.pair .say{border-inline-end:0;border-bottom:var(--border) solid var(--line)}}

/* imagery */
.imagery{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:820px){.imagery{grid-template-columns:1fr}}
.imgrule{background:var(--card);border:var(--border) solid var(--line);border-radius:var(--r);padding:20px 22px}
.imgrule b{display:block;font-size:15px;font-weight:700;margin-bottom:6px}
.imgrule p{margin:0;color:var(--ink-2);font-size:14.5px}
.imgrule .mk{font-family:var(--mono);font-size:10px;letter-spacing:.08em;display:block;margin-bottom:8px;direction:ltr;text-transform:uppercase}
.imgrule.yes .mk{color:var(--accent)}
.imgrule.no .mk{color:#E02040}

.usage{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:860px){.usage{grid-template-columns:repeat(2,1fr)}}
.use{background:var(--card);border:var(--border) solid var(--line);border-radius:var(--r);overflow:hidden;margin:0}
.use .box{height:136px;display:grid;place-items:center;padding:24px;background:#fff;border-bottom:var(--border) solid var(--line);overflow:hidden}
.use .box .logo{width:140px}
.use .box .logo svg{width:100%;height:auto;display:block}
.use figcaption{padding:12px 14px;font-size:13.5px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.use .mk{font-size:12px;font-weight:700;flex:none;margin-top:2px}
.use.no .mk{color:#E02040}
.use.yes .mk{color:var(--accent)}
.u-stretch .logo{transform:scaleX(1.5)}
.box.busy{background:repeating-linear-gradient(135deg,#C6CBD8 0 10px,#A9B1C4 10px 20px)}

footer{border-top:var(--border) solid var(--line);padding:44px 0 62px;color:var(--ink-2);font-size:14.5px}
.footgrid{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.footgrid p{margin:0;max-width:46ch}
footer a{color:var(--accent);text-decoration:none;font-weight:600}
footer a:hover{text-decoration:underline}
.adminlink{margin-inline-start:auto;font-size:12.5px;color:var(--ink-3)}

#toast{position:fixed;inset-inline-start:50%;bottom:26px;transform:translate(50%,18px);background:var(--ink);color:var(--surface);padding:11px 20px;border-radius:100px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:80;max-width:90vw}
html[dir="ltr"] #toast{transform:translate(-50%,18px)}
#toast.show{transform:translate(50%,0);opacity:1}
html[dir="ltr"] #toast.show{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <span class="mini" id="topmark"></span>
    <nav id="nav"></nav>
    <div class="langswitch" id="langswitch"></div>
  </div>
</div>

<header class="hero">
  <div class="wrap">
    <span class="eyebrow" id="hero-eyebrow"></span>
    <h1 id="hero-title"></h1>
    <p id="hero-lede"></p>
    <div class="hero-actions">
      <button class="btn primary" id="dl-all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
        <span id="dl-all-label"></span>
      </button>
      <a class="btn ghost" href="#resources">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
        <span id="res-label"></span>
      </a>
    </div>
  </div>
  <div class="wrap"><div class="specstrip" id="specstrip"></div></div>
</header>

<main>
  <section id="logos"><div class="wrap">
    <div class="sechead"><h2 id="h-logos"></h2><p id="p-logos"></p></div>
    <div class="picker" id="picker"></div>
    <div class="grid" id="logo-grid"></div>
  </div></section>

  <section id="colors"><div class="wrap">
    <div class="sechead"><h2 id="h-colors"></h2><p id="p-colors"></p></div>
    <div class="colors" id="color-grid"></div>
  </div></section>

  <section id="type"><div class="wrap">
    <div class="sechead"><h2 id="h-type"></h2><p id="p-type"></p></div>
    <div class="typeblock" id="type-grid"></div>
  </div></section>

  <section id="resources"><div class="wrap">
    <div class="sechead"><h2 id="h-resources"></h2><p id="p-resources"></p></div>
    <div class="reslist" id="res-grid"></div>
  </div></section>

  <section id="usage"><div class="wrap">
    <div class="sechead"><h2 id="h-usage"></h2><p id="p-usage"></p></div>
    <div class="usage" id="usage-grid"></div>
  </div></section>

  <section id="voice"><div class="wrap">
    <div class="sechead"><h2 id="h-voice"></h2><p id="p-voice"></p></div>
    <div class="voice" id="voice-traits"></div>
    <div class="saypairs" id="voice-pairs"></div>
  </div></section>

  <section id="imagery"><div class="wrap">
    <div class="sechead"><h2 id="h-imagery"></h2><p id="p-imagery"></p></div>
    <div class="imagery" id="imagery-grid"></div>
  </div></section>
</main>

<footer><div class="wrap footgrid">
  <p id="foot-contact"></p>
  <p class="he-label" style="margin-inline-start:auto" id="foot-legal"></p>
  <a class="adminlink" href="admin.html" id="admin-link">⚙︎ ניהול</a>
</div></footer>

<div id="toast" role="status" aria-live="polite"></div>

<script>

   fetched at load so the admin panel's edits appear without touching this file. */

const fmtBytes = b => !b ? "" : b>1048576 ? (b/1048576).toFixed(1)+"MB" : Math.max(1,Math.round(b/1024))+"KB";

const SECTIONS = ["logos","colors","type","resources","usage","voice","imagery"];

/* ---------- logo rendering ---------- */
let G = BRAND.logo?.groups || [];
const crop = part => BRAND.logo?.crops?.[part] || BRAND.logo?.viewBox;
function svgFor(part, fills){
  fills = fills || {};
  const body = G.filter(g => part === "full" || g.part === part)
    .map(g => `<g fill="${fills[g.role] || g.fill || "currentColor"}">${
      g.d.map(d => `<path d="${d}"/>`).join("")}</g>`).join("");
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${crop(part)}">${body}</svg>`;
}
const V = id => BRAND.variants.find(v => v.id === id);

function applyTheme(d){
  if(!d) return;
  const r = document.documentElement.style;
  const map = {accent:"--accent",accentInk:"--accent-ink",ink:"--ink",ink2:"--ink-2",ink3:"--ink-3",
    surface:"--surface",card:"--card",line:"--line",dark:"--dark"};
  for(const k in map){ if(d[k]) r.setProperty(map[k], d[k]); }
  if(d.radius!=null) r.setProperty("--r", d.radius+"px");
  if(d.track) r.setProperty("--track", d.track);
}

/* ---------- render ---------- */
function render(){
  const d = document, u = U();
  G = BRAND.logo?.groups || [];
  applyTheme(BRAND.design);
  d.documentElement.lang = LANG;
  d.documentElement.dir = RTL.has(LANG) ? "rtl" : "ltr";

  d.getElementById("langswitch").innerHTML = (BRAND.lang?.enabled || ["he"]).map(l =>
    `<button data-lang="${l}" aria-pressed="${l===LANG}">${l.toUpperCase()}</button>`).join("");

  d.getElementById("nav").innerHTML = SECTIONS.filter(sectionHas).map(k =>
    `<a href="#${k}">${u.nav[k]}</a>`).join("");
  SECTIONS.forEach(k => { d.getElementById(k).hidden = !sectionHas(k); });

  d.getElementById("topmark").innerHTML = svgFor("symbol", {symbol: BRAND.design?.accent || "#83D429"});
  d.getElementById("hero-eyebrow").textContent =
    `Brand guidelines · v${BRAND.brand.version} · ${t(BRAND.brand.updated)}`;
  d.getElementById("hero-title").innerHTML = t(BRAND.copy.heroTitle);
  d.getElementById("hero-lede").textContent = t(BRAND.copy.heroLede);
  d.getElementById("dl-all-label").textContent = u.dlAll;
  d.getElementById("res-label").textContent = u.resources;
  d.getElementById("specstrip").innerHTML = (BRAND.copy.stats || []).map(s =>
    `<div><b>${esc(t(s.value))}</b><span class="he-label">${esc(t(s.label))}</span></div>`).join("");

  SECTIONS.forEach(k => {
    const h = d.getElementById("h-" + k), p = d.getElementById("p-" + k);
    if(h) h.textContent = t(BRAND.copy.sections?.[k]?.title) || u.nav[k];
    if(p) p.textContent = t(BRAND.copy.sections?.[k]?.lede);
  });

  renderLogos(); renderColors(); renderType(); renderResources();
  renderUsage(); renderVoice(); renderImagery();

  d.getElementById("foot-contact").innerHTML = t(BRAND.copy.footContact);
  d.getElementById("foot-legal").textContent = t(BRAND.copy.footLegal);
}

const sectionHas = k => ({
  logos:  () => (BRAND.variants||[]).length,
  colors: () => (BRAND.colors||[]).length,
  type:   () => (BRAND.typography||[]).length,
  resources:() => (BRAND.resources||[]).length,
  usage:  () => (BRAND.usage||[]).length,
  voice:  () => (BRAND.voice?.traits||[]).length || (BRAND.voice?.pairs||[]).length,
  imagery:() => (BRAND.imagery||[]).length
}[k]?.() || 0);

function renderLogos(){
  const u = U();
  document.getElementById("picker").innerHTML = (BRAND.backgroundGuide || []).map(g =>
    `<div><b>${esc(t(g.bg))}</b><span>${esc(t(g.why))}</span><i>${esc(g.use)}</i></div>`).join("");
  document.getElementById("picker").hidden = !(BRAND.backgroundGuide || []).length;

  document.getElementById("logo-grid").innerHTML = BRAND.variants.map(v => `
    <article class="card" data-id="${v.id}" data-bg="${v.bg}">
      <div class="card-head">
        <h3>${esc(t(v.name))}</h3>
        <span class="tag ${v.source ? "src" : ""}">${v.source ? esc(v.source) : u.derived}</span>
        <span class="he-label">${esc(t(v.note))}</span>
      </div>
      <div class="stage" data-bg="${v.bg}">
        <div class="logo">${svgFor(v.part, v.fills)}</div>
        <span class="guide-note">${u.clearspaceNote}</span>
        <span class="warn">${u.bad}</span>
      </div>
      <div class="controls">
        <div class="swatches">${["trans","light","dark","brand"].map(b =>
          `<button class="sw ${b}" data-bg="${b}" aria-pressed="${b===v.bg}" aria-label="${u.bg[b]}"></button>`).join("")}</div>
        <button class="toggle" data-guides aria-pressed="false"><span class="dot"></span>${u.clearspace}</button>
      </div>
      <div class="formats">
        <button class="chip" data-dl="svg" data-id="${v.id}">SVG</button>
        <button class="chip" data-dl="png" data-id="${v.id}" data-w="1000">PNG <small>1000px</small></button>
        <button class="chip" data-dl="png" data-id="${v.id}" data-w="3000">PNG <small>3000px</small></button>
        ${Object.keys(v.files||{}).map(k =>
          `<button class="chip" data-dl="${k}" data-id="${v.id}">${k.toUpperCase()}</button>`).join("")}
      </div>
    </article>`).join("");
}

function renderColors(){
  document.getElementById("color-grid").innerHTML = (BRAND.colors||[]).map(c => `
    <button class="color" data-hex="${c.hex}">
      <div class="chipcolor" style="background:${c.hex}"><span class="copy">${U().copy}</span></div>
      <div class="meta">
        <b>${esc(t(c.name))}</b>
        <span>${c.hex}${c.rgb ? " · RGB " + c.rgb : ""}</span>
        ${c.cmyk ? `<span>CMYK ${c.cmyk}</span>` : ""}
        ${c.pantone ? `<span>PANTONE ${c.pantone}</span>` : ""}
        <span class="role">${esc(t(c.role))}</span>
      </div>
    </button>`).join("");
}

function renderType(){
  document.getElementById("type-grid").innerHTML = (BRAND.typography||[]).map(f => `
    <div class="typerow">
      <div class="info"><b>${esc(t(f.role))}</b><span>${esc(f.spec||"")}</span></div>
      <div class="sample" style="font-family:${f.family||"var(--body)"};font-weight:${f.weight||400};font-size:${f.size||"20px"};${f.style||""}">${esc(t(f.sample))}</div>
    </div>`).join("");
}

const DLICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>`;
const EXTICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>`;
function renderResources(){
  const u = U();
  document.getElementById("res-grid").innerHTML = (BRAND.resources||[]).map(r => {
    const isLink = r.url != null && r.url !== "";
    const attrs = isLink
      ? `href="${esc(r.url)}" target="_blank" rel="noopener"`
      : `href="${esc(r.file)}" download`;
    const badge = r.ext ? esc(r.ext) : (isLink ? "LINK" : "");
    return `
    <div class="res">
      <div class="res-top">
        ${r.cat ? `<span class="cat">${esc(t(r.cat))}</span>` : ""}
        <b>${esc(t(r.title))}</b>
        ${r.desc ? `<p>${esc(t(r.desc))}</p>` : ""}
      </div>
      <a class="res-dl" ${attrs}>
        ${isLink ? EXTICON : DLICON}<span>${isLink ? u.open : u.download}</span>
        ${badge ? `<span class="ext">${badge}</span>` : ""}
        ${(!isLink && r.bytes) ? `<span class="sz">${fmtBytes(r.bytes)}</span>` : ""}
      </a>
    </div>`;
  }).join("");
}

function renderUsage(){
  const u = U();
  document.getElementById("usage-grid").innerHTML = (BRAND.usage||[]).map(r => `
    <figure class="use ${r.ok ? "yes" : "no"} ${r.effect || ""}">
      <div class="box ${r.box || ""}" ${r.boxStyle ? `style="${r.boxStyle}"` : ""}>
        <div class="logo">${svgFor("full", r.fills || BRAND.variants[0].fills)}</div>
      </div>
      <figcaption><span class="mk">${r.ok ? u.yes : u.no}</span>${esc(t(r.text))}</figcaption>
    </figure>`).join("");
}

function renderVoice(){
  const u = U();
  document.getElementById("voice-traits").innerHTML = (BRAND.voice?.traits||[]).map(x =>
    `<div class="trait"><b>${esc(t(x.name))}</b><p>${esc(t(x.desc))}</p></div>`).join("");
  document.getElementById("voice-pairs").innerHTML = (BRAND.voice?.pairs||[]).map(p => `
    <div class="pair">
      <div class="say"><span class="lbl">${u.say}</span>${esc(t(p.say))}</div>
      <div class="dont"><span class="lbl">${u.dont}</span>${esc(t(p.dont))}</div>
    </div>`).join("");
}

function renderImagery(){
  const u = U();
  document.getElementById("imagery-grid").innerHTML = (BRAND.imagery||[]).map(r => `
    <div class="imgrule ${r.ok ? "yes" : "no"}">
      <span class="mk">${r.ok ? u.yes : u.no}</span>
      <b>${esc(t(r.title))}</b><p>${esc(t(r.desc))}</p>
    </div>`).join("");
}

/* ---------- interactions ---------- */
const toastEl = document.getElementById("toast");
let toastTimer;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3000);
}

document.addEventListener("click", async e => {
  const lb = e.target.closest("[data-lang]");
  if(lb){ LANG = lb.dataset.lang; render(); return; }
  const sw = e.target.closest(".sw");
  if(sw){
    const card = sw.closest(".card"), v = V(card.dataset.id), stage = card.querySelector(".stage");
    card.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-pressed", String(b === sw)));
    card.dataset.bg = stage.dataset.bg = sw.dataset.bg;
    stage.classList.toggle("bad", Array.isArray(v.ok) && !v.ok.includes(sw.dataset.bg));
    return;
  }
  const tg = e.target.closest("[data-guides]");
  if(tg){
    const on = tg.getAttribute("aria-pressed") !== "true";
    tg.setAttribute("aria-pressed", String(on));
    tg.closest(".card").querySelector(".stage").classList.toggle("guides", on);
    return;
  }
  const col = e.target.closest(".color");
  if(col){
    try{ await navigator.clipboard.writeText(col.dataset.hex); toast(col.dataset.hex + " " + U().copied); }
    catch{ toast(U().copyFail); }
    return;
  }
  const chip = e.target.closest("[data-dl]");
  if(chip){ e.preventDefault(); download(chip.dataset.dl, chip.dataset.id, Number(chip.dataset.w || 1000)); }
});

function saveBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), {href:url, download:filename});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

async function download(kind, id, width){
  const v = V(id), slug = BRAND.brand.slug || "logo";
  if(kind === "svg"){
    saveBlob(new Blob([svgFor(v.part, v.fills)], {type:"image/svg+xml"}), `${slug}-${v.id}.svg`);
    toast(U().downloaded(`${slug}-${v.id}.svg`)); return;
  }
  if(kind === "png"){
    const src = svgFor(v.part, v.fills);
    const [,,w,h] = src.match(/viewBox="([\d.\s-]+)"/)[1].trim().split(/\s+/).map(Number);
    const cv = document.createElement("canvas");
    cv.width = width; cv.height = Math.round(width * h / w);
    const img = new Image();
    img.onload = () => {
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => { saveBlob(b, `${slug}-${v.id}-${width}.png`); toast(U().downloaded(`${slug}-${v.id}-${width}.png`)); }, "image/png");
    };
    img.onerror = () => toast(U().pngFail);
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(src);
    return;
  }
  const url = v.files?.[kind];
  try{
    const r = await fetch(url, {method:"HEAD"});
    if(!r.ok) throw new Error();
    const a = Object.assign(document.createElement("a"), {href:url, download:url.split("/").pop()});
    document.body.appendChild(a); a.click(); a.remove();
  }catch{ toast(U().fileMissing(kind.toUpperCase())); }
}

document.getElementById("dl-all").addEventListener("click", () => {
  toast(U().downloading(BRAND.variants.length));
  BRAND.variants.forEach((v,i) => setTimeout(() => download("svg", v.id), i * 380));
});

/* ---------- boot: prefer live data/content.json, fall back to baked copy ---------- */
(async function boot(){
  try{
    const r = await fetch("data/content.json", {cache:"no-store"});
    if(r.ok){ BRAND = await r.json(); LANG = BRAND.lang?.default || LANG; }
  }catch(e){ /* file:// or offline — use baked DEFAULT_CONTENT */ }
  render();
})();
</script>
</body>
